<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeRoute — Pilot Feedback</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F2F6FA;color:#1C2B3A;padding-bottom:60px;}
.hdr{background:linear-gradient(135deg,#050D1A,#0D1E36);color:#fff;padding:36px 20px 32px;text-align:center;}
.badge{display:inline-block;background:rgba(0,180,255,.15);border:1px solid rgba(0,180,255,.4);color:#7FD9FF;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:4px;margin-bottom:12px;}
.hdr h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.hdr h1 span{color:#00B4FF;}
.hdr p{font-size:14px;color:#BFCCDB;line-height:1.6;max-width:480px;margin:10px auto 0;}
.wrap{max-width:580px;margin:0 auto;padding:20px 16px;}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(5,13,26,.08);padding:20px 18px;margin-bottom:16px;border:1px solid #D7DEE6;}
.ct{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#050D1A;margin-bottom:4px;}
.cs{font-size:13px;color:#5B6B7C;margin-bottom:14px;line-height:1.5;}
.lbl{display:block;font-size:13px;font-weight:600;color:#1C2B3A;margin:16px 0 6px;}
input[type=text],select,textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #D7DEE6;font-size:14px;font-family:inherit;background:#FBFCFE;color:#1C2B3A;-webkit-appearance:none;appearance:none;}
textarea{min-height:72px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00B4FF;box-shadow:0 0 0 3px rgba(0,180,255,.12);}
.stars{display:flex;gap:8px;margin-top:6px;}
.star{font-size:32px;cursor:pointer;color:#DFE6EE;-webkit-user-select:none;user-select:none;transition:color .1s;}
.star.on{color:#00B4FF;}
.rg{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.ro{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid #D7DEE6;border-radius:9px;cursor:pointer;font-size:13px;background:#FBFCFE;}
.rd{width:16px;height:16px;border-radius:50%;border:2px solid #CCC;flex-shrink:0;}
.ro.on{border-color:#00B4FF;background:#EBF7FF;color:#0A4A70;font-weight:600;}
.ro.on .rd{border-color:#00B4FF;background:#00B4FF;}
.sbtn{width:100%;padding:15px;border-radius:10px;border:none;background:linear-gradient(135deg,#00B4FF,#0088CC);color:#fff;font-weight:700;font-size:16px;cursor:pointer;letter-spacing:.3px;font-family:inherit;}
.ok{text-align:center;padding:40px 20px;}
.ok-icon{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#00B4FF,#0088CC);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;box-shadow:0 4px 20px rgba(0,180,255,.3);}
.ok h2{font-size:18px;font-weight:700;margin-bottom:8px;}
.ok p{font-size:14px;color:#5B6B7C;line-height:1.6;}
.retry{margin-top:16px;background:none;border:1px solid #00B4FF;color:#0A4A70;padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div class="hdr">
  <div class="badge">✈ SAFEROUTE</div>
  <h1>SafeRoute <span>Pilot Feedback</span></h1>
  <p>You've been among the first pilots to use SafeRoute. Your operational perspective is the most valuable input we can get — what works, what's missing, and what would make it genuinely useful on the line.</p>
</div>
<div class="wrap" id="app"></div>

<script>
var EMAIL = 'marchantlaurie@icloud.com';
var lastMailto = '';

// Form data object
var F = {
  name:'', role:'Captain', fleet:'A318/319/320/321', base:'',
  overall:0, appearance:0,
  frequency:'', routes:'',
  threatsOk:'', threatsNotes:'',
  wxOk:'', wxNotes:'',
  radarOk:'', radarNotes:'',
  aiOk:'', aiNotes:'',
  missingAirports:'', missingFeatures:'', decision:'',
  lookNotes:'',
  recommend:'', opValue:'', endorse:'',
  bugs:'', other:''
};

var ROLES  = ['Captain','First Officer','Training Captain / TRE / TRI','ATPL student','PPL/CPL holder','Dispatcher / Operations','Other'];
var FLEETS = ['A318/319/320/321','A330/340','A350','A380','B737','B757/767','B777','B787','Other narrowbody','Other widebody','Mixed fleet'];
var YNM    = ['Yes','No','Maybe / depends'];
var FREQ   = ['Before every flight','Most flights','Occasionally','Just once or twice','Not yet used it in anger'];

function app() { return document.getElementById('app'); }

function showForm() {
  var a = app();
  a.innerHTML = '';

  addCard(a, '✦ About you', 'So we can put your feedback in context', function(c) {
    addLabel(c, 'Your name (optional)');
    addText(c, 'name', 'e.g. James T.');
    addLabel(c, 'Your role');
    addSelect(c, 'role', ROLES);
    addLabel(c, 'Fleet');
    addSelect(c, 'fleet', FLEETS);
    addLabel(c, 'Base airport (IATA)');
    addText(c, 'base', 'e.g. LHR, MAN, EDI');
    addLabel(c, 'Overall rating');
    addStars(c, 'overall');
  });

  addCard(a, '⬤ How you\'ve used it', 'Which features and how often', function(c) {
    addLabel(c, 'How often have you used SafeRoute before a flight?');
    addRadio(c, 'frequency', FREQ);
    addLabel(c, 'Which routes have you tried it on?');
    addTA(c, 'routes', 'e.g. LHR–JFK, LHR–DXB, LHR–AGP');
  });

  addCard(a, '⚠ Threat intelligence', 'The hazard cards — terrain, MAC, windshear, volcanic, security etc.', function(c) {
    addLabel(c, 'Was the threat intelligence accurate and operationally relevant?');
    addRadio(c, 'threatsOk', YNM);
    addLabel(c, 'Any threats that were wrong, missing, or not relevant?');
    addTA(c, 'threatsNotes', 'e.g. missing terrain warning for X, windshear at AGP was very accurate...');
  });

  addCard(a, '🌤 Live weather', 'METAR, TAF, and weather interpretation', function(c) {
    addLabel(c, 'Was the live weather information useful for pre-flight planning?');
    addRadio(c, 'wxOk', YNM);
    addLabel(c, 'What would improve the weather section?');
    addTA(c, 'wxNotes', 'e.g. SIGMET overlay, wind component calculator...');
  });

  addCard(a, '🗺 Route radar map', 'The animated 6-hour RainViewer radar overlay', function(c) {
    addLabel(c, 'Was the animated radar map useful?');
    addRadio(c, 'radarOk', YNM);
    addLabel(c, 'What would improve the map?');
    addTA(c, 'radarNotes', 'e.g. SIGMET overlay, turbulence layer, winds aloft...');
  });

  addCard(a, '★ AI safety briefing', 'The GPT-4o generated route briefing', function(c) {
    addLabel(c, 'Was the AI-generated briefing accurate and useful?');
    addRadio(c, 'aiOk', YNM);
    addLabel(c, 'What would improve the AI briefing?');
    addTA(c, 'aiNotes', 'e.g. too generic, missed specific approach hazard...');
  });

  addCard(a, '＋ Gaps & missing content', "What isn't there yet", function(c) {
    addLabel(c, 'Any airports missing from the intelligence database?');
    addTA(c, 'missingAirports', 'e.g. CVG — no intel, FNC — RA advisory missing');
    addLabel(c, 'What features or data would make SafeRoute genuinely useful on the line?');
    addTA(c, 'missingFeatures', 'e.g. NOTAM integration, PDF export, PIREP layer...');
    addLabel(c, 'Did SafeRoute ever change or influence a pre-flight decision?');
    addTA(c, 'decision', 'e.g. chose different alternate, flagged something to crew...');
  });

  addCard(a, '◈ Appearance & usability', 'Design, layout, readability on mobile and desktop', function(c) {
    addLabel(c, 'Appearance rating');
    addStars(c, 'appearance');
    addLabel(c, 'Any layout or readability issues?');
    addTA(c, 'lookNotes', 'e.g. hard to read in cockpit lighting, font too small...');
  });

  addCard(a, '→ Professional opinion', '', function(c) {
    addLabel(c, 'Would you recommend SafeRoute to other line pilots?');
    addRadio(c, 'recommend', YNM);
    addLabel(c, 'In your professional opinion, does SafeRoute add genuine operational value to aviation safety?');
    addRadio(c, 'opValue', YNM);
    addLabel(c, "If yes — would you be willing to say so in writing? A short note on how you've used it and what value it's added would be genuinely useful for development and funding applications.");
    addRadio(c, 'endorse', YNM);
  });

  addCard(a, '⚙ Bugs & anything else', '', function(c) {
    addLabel(c, 'Any bugs, errors, or things that didn\'t work?');
    addTA(c, 'bugs', 'Optional — what happened and what you expected');
    addLabel(c, 'Anything else?');
    addTA(c, 'other', 'Open floor — any other thoughts');
  });

  var btn = document.createElement('button');
  btn.className = 'sbtn';
  btn.textContent = 'Send feedback ✈';
  btn.onclick = doSubmit;
  a.appendChild(btn);
}

function showSuccess() {
  var a = app();
  a.innerHTML = '';
  var d = document.createElement('div');
  d.className = 'card ok';
  d.innerHTML = '<div class="ok-icon">✓</div><h2>Feedback sent</h2><p>Your mail app should have opened with everything pre-filled — just hit send.</p>';
  var rb = document.createElement('button');
  rb.className = 'retry';
  rb.textContent = "Mail didn't open — try again";
  rb.onclick = function() { window.location.href = lastMailto; };
  d.appendChild(rb);
  a.appendChild(d);
}

// ── Card builder ─────────────────────────────────────────────────────────────
function addCard(parent, title, sub, buildFn) {
  var c = document.createElement('div');
  c.className = 'card';
  var t = document.createElement('div'); t.className = 'ct'; t.textContent = title; c.appendChild(t);
  if (sub) { var s = document.createElement('div'); s.className = 'cs'; s.textContent = sub; c.appendChild(s); }
  buildFn(c);
  parent.appendChild(c);
}

function addLabel(parent, text) {
  var l = document.createElement('label');
  l.className = 'lbl';
  l.textContent = text;
  parent.appendChild(l);
}

function addText(parent, key, placeholder) {
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = placeholder;
  inp.value = F[key];
  inp.addEventListener('input', function() { F[key] = this.value; });
  parent.appendChild(inp);
}

function addTA(parent, key, placeholder) {
  var ta = document.createElement('textarea');
  ta.placeholder = placeholder;
  ta.value = F[key];
  ta.addEventListener('input', function() { F[key] = this.value; });
  parent.appendChild(ta);
}

function addSelect(parent, key, opts) {
  var sel = document.createElement('select');
  for (var i = 0; i < opts.length; i++) {
    var o = document.createElement('option');
    o.value = opts[i]; o.textContent = opts[i];
    if (opts[i] === F[key]) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', function() { F[key] = this.value; });
  parent.appendChild(sel);
}

function addStars(parent, key) {
  var wrap = document.createElement('div');
  wrap.className = 'stars';
  for (var i = 1; i <= 5; i++) {
    (function(val) {
      var s = document.createElement('span');
      s.className = F[key] >= val ? 'star on' : 'star';
      s.textContent = '★';
      s.addEventListener('click', function() {
        F[key] = val;
        var all = wrap.querySelectorAll('.star');
        for (var j = 0; j < all.length; j++) {
          all[j].className = j < val ? 'star on' : 'star';
        }
      });
      wrap.appendChild(s);
    })(i);
  }
  parent.appendChild(wrap);
}

function addRadio(parent, key, opts) {
  var wrap = document.createElement('div');
  wrap.className = 'rg';
  for (var i = 0; i < opts.length; i++) {
    (function(val) {
      var row = document.createElement('div');
      row.className = F[key] === val ? 'ro on' : 'ro';
      var dot = document.createElement('div');
      dot.className = 'rd';
      row.appendChild(dot);
      row.appendChild(document.createTextNode(val));
      row.addEventListener('click', function() {
        F[key] = val;
        var rows = wrap.querySelectorAll('.ro');
        for (var j = 0; j < rows.length; j++) {
          rows[j].className = 'ro';
        }
        row.className = 'ro on';
      });
      wrap.appendChild(row);
    })(opts[i]);
  }
  parent.appendChild(wrap);
}

// ── Submit ───────────────────────────────────────────────────────────────────
function doSubmit() {
  var subject = 'SafeRoute feedback — ' + (F.name || 'Anonymous') + ' · ' + F.role + (F.base ? ' · ' + F.base : '');
  var b = [
    '=== SAFEROUTE PILOT FEEDBACK ===', '',
    'Name: ' + (F.name || 'Anonymous'),
    'Role: ' + F.role,
    'Fleet: ' + F.fleet,
    'Base: ' + (F.base || '-'),
    '', 'Overall rating: ' + strs(F.overall),
    'Appearance rating: ' + strs(F.appearance),
    '', '=== USAGE ===',
    'Frequency: ' + (F.frequency || '-'),
    'Routes tried: ' + (F.routes || '-'),
    '', '=== THREAT INTELLIGENCE ===',
    'Accurate/relevant: ' + (F.threatsOk || '-'),
    'Notes: ' + (F.threatsNotes || '-'),
    '', '=== LIVE WEATHER ===',
    'Useful: ' + (F.wxOk || '-'),
    'Notes: ' + (F.wxNotes || '-'),
    '', '=== RADAR MAP ===',
    'Useful: ' + (F.radarOk || '-'),
    'Notes: ' + (F.radarNotes || '-'),
    '', '=== AI BRIEFING ===',
    'Useful: ' + (F.aiOk || '-'),
    'Notes: ' + (F.aiNotes || '-'),
    '', '=== GAPS ===',
    'Missing airports: ' + (F.missingAirports || '-'),
    'Missing features: ' + (F.missingFeatures || '-'),
    'Changed a decision: ' + (F.decision || '-'),
    '', '=== APPEARANCE ===',
    'Notes: ' + (F.lookNotes || '-'),
    '', '=== PROFESSIONAL OPINION ===',
    'Would recommend: ' + (F.recommend || '-'),
    'Adds operational value to aviation safety: ' + (F.opValue || '-'),
    'Willing to provide written endorsement: ' + (F.endorse || '-'),
    '', '=== BUGS & OTHER ===',
    'Bugs: ' + (F.bugs || '-'),
    'Other: ' + (F.other || '-'),
    '', 'Submitted: ' + new Date().toISOString()
  ];
  lastMailto = 'mailto:' + encodeURIComponent(EMAIL) +
    '?subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(b.join('\n'));
  showSuccess();
  window.location.href = lastMailto;
}

function strs(n) {
  var s = '';
  for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '☆';
  return n ? s + ' (' + n + '/5)' : 'Not rated';
}

showForm();
</script>
</body>
</html>
