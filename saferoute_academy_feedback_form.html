<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeRoute Academy — Tester Feedback</title>
</head>
<body>
<div id="root"></div>
<style>
  :root {
    --sr-navy: #0a1e3d;
    --sr-navy-light: #122c56;
    --sr-cyan: #00c2d1;
    --sr-cyan-soft: #7fe3ec;
    --sr-bg: #f4f7fa;
    --sr-text: #1c2b3a;
    --sr-muted: #5b6b7c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .sr-wrap {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--sr-bg);
    color: var(--sr-text);
    min-height: 100vh;
    padding: 0 0 40px;
  }
  .sr-header {
    background: linear-gradient(135deg, var(--sr-navy), var(--sr-navy-light));
    color: white;
    padding: 28px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .sr-header::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, var(--sr-cyan) 0%, transparent 70%);
    opacity: 0.25;
  }
  .sr-header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .sr-header .sr-tag {
    color: var(--sr-cyan-soft);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .sr-header p {
    margin: 10px auto 0;
    max-width: 480px;
    font-size: 14px;
    color: #cfd9e8;
    line-height: 1.5;
  }
  .sr-container {
    max-width: 560px;
    margin: -18px auto 0;
    padding: 0 16px;
  }
  .sr-card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(10, 30, 61, 0.08);
    padding: 20px 18px;
    margin-bottom: 16px;
    border: 1px solid #e6ebf1;
  }
  .sr-section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--sr-navy);
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sr-section-sub {
    font-size: 13px;
    color: var(--sr-muted);
    margin: 0 0 12px;
  }
  label.sr-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--sr-text);
    margin: 12px 0 6px;
  }
  input[type="text"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid #d7dee6;
    font-size: 14px;
    font-family: inherit;
    background: #fbfcfe;
    color: var(--sr-text);
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--sr-cyan);
    box-shadow: 0 0 0 3px rgba(0, 194, 209, 0.15);
  }
  .sr-checks {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 4px;
  }
  .sr-check-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--sr-text);
    cursor: pointer;
    font-weight: normal;
  }
  .sr-check-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--sr-cyan);
    cursor: pointer;
  }
  .sr-stars {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .sr-star {
    font-size: 26px;
    cursor: pointer;
    color: #dfe6ee;
    transition: color 0.15s;
    user-select: none;
  }
  .sr-star.active { color: var(--sr-cyan); }
  .sr-submit {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--sr-cyan);
    color: var(--sr-navy);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 8px;
  }
  .sr-submit:active { transform: scale(0.99); }
  .sr-submit:disabled { opacity: 0.6; }
  .sr-status {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: var(--sr-muted);
  }
  .sr-success {
    text-align: center;
    padding: 30px 16px;
  }
  .sr-success .sr-check {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--sr-cyan);
    color: var(--sr-navy);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin: 0 auto 14px;
  }
  .sr-radio-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 8px 0 4px;
  }
  .sr-radio-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 15px;
    border: 1px solid #d7dee6;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--sr-text);
    background: #fbfcfe;
    transition: border-color 0.15s, background 0.15s;
  }
  .sr-radio-item.selected {
    border-color: var(--sr-cyan);
    background: rgba(0, 194, 209, 0.07);
  }
  .sr-radio-item input[type="radio"] {
    width: 18px;
    height: 18px;
    accent-color: var(--sr-cyan);
    cursor: pointer;
    flex-shrink: 0;
  }
  .sr-toggle-admin {
    text-align: center;
    margin-top: 6px;
  }
  .sr-toggle-admin button {
    background: none; border: none; color: var(--sr-muted);
    font-size: 12px; text-decoration: underline; cursor: pointer;
  }
  .sr-entry {
    border-bottom: 1px solid #edf1f5;
    padding: 12px 0;
  }
  .sr-entry:last-child { border-bottom: none; }
  .sr-entry-meta {
    font-size: 12px; color: var(--sr-muted);
    display: flex; justify-content: space-between; margin-bottom: 4px;
  }
  .sr-entry-field { font-size: 13px; margin: 2px 0; }
  .sr-entry-field b { color: var(--sr-navy); }
  .sr-empty { text-align: center; color: var(--sr-muted); font-size: 13px; padding: 10px 0; }
</style>
<script>
(function(){
  const root = document.getElementById('root');

  const ROLES = ["Student pilot", "Instructor", "PPL/CPL holder", "ATPL / Airline pilot", "Other aviation professional", "Other"];
  const YES_NO_MAYBE = ["Yes", "No", "Maybe"];
  const REGIONS = ["Florida", "Phoenix / Arizona", "United Kingdom"];

  let state = {
    submitted: false,
    saving: false,
    error: "",
    showAdmin: false,
    entries: [],
    loadingEntries: false,
    form: {
      name: "",
      role: ROLES[0],
      regionsTested: [],
      startDate: "",
      trainingHistory: "",
      overall: 0,
      appearance: 0,
      appearanceNotes: "",
      missingAirfields: "",
      partsUsed: "",
      foundUseful: "",
      confusing: "",
      changedPrep: "",
      additionalFunctionality: "",
      continueUsing: "",
      recommend: "",
      wouldRecommendProfessionally: "",
      addsGenuineValue: "",
      willingToWriteUp: "",
      bugs: "",
      general: ""
    }
  };

  function render() {
    root.innerHTML = "";
    const wrap = document.createElement('div');
    wrap.className = 'sr-wrap';

    wrap.innerHTML = `
      <div class="sr-header">
        <div class="sr-tag">SafeRoute Academy</div>
        <h1>Tester Feedback</h1>
        <p>Thanks for trying the app. A few honest minutes here goes a long way — appearance, missing airfields, and anything a student pilot would find useful, across Florida, Phoenix/Arizona, or the UK.</p>
      </div>
      <div class="sr-container" id="sr-container"></div>
    `;
    root.appendChild(wrap);
    const container = wrap.querySelector('#sr-container');

    if (state.submitted) {
      container.innerHTML = `
        <div class="sr-card sr-success">
          <div class="sr-check">✓</div>
          <div style="font-weight:700; font-size:16px; margin-bottom:4px;">Almost done</div>
          <div style="color:var(--sr-muted); font-size:13px;">Your mail app should have opened with the response filled in — just hit send. A backup copy has also been saved here.</div>
        </div>
        <div style="text-align:center; margin-bottom:16px;">
          <button id="f-reopen-mail" style="background:none;border:1px solid var(--sr-cyan);color:var(--sr-navy);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;">Mail app didn't open — try again</button>
        </div>
      `;
      const again = document.createElement('div');
      again.style.textAlign = 'center';
      const btn = document.createElement('button');
      btn.textContent = 'Submit another response';
      btn.style.cssText = 'background:none;border:1px solid var(--sr-cyan);color:var(--sr-navy);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;';
      btn.onclick = () => { state.submitted = false; state.form = { name: "", role: ROLES[0], regionsTested: [], overall: 0, appearance: 0, appearanceNotes: "", missingAirfields: "", studentFeatures: "", wouldRecommendProfessionally: "", addsGenuineValue: "", willingToWriteUp: "", bugs: "", general: "" }; render(); };
      again.appendChild(btn);
      container.appendChild(again);

      const reopenBtn = container.querySelector('#f-reopen-mail');
      if (reopenBtn && state.lastEntry) {
        reopenBtn.onclick = () => openMail(state.lastEntry);
      }

      renderAdminToggle(container);
      return;
    }

    const card = document.createElement('div');
    card.className = 'sr-card';
    card.innerHTML = `
      <div class="sr-section-title">Overall</div>
      <div class="sr-section-sub">General impression of the app so far</div>
      <label class="sr-label">Your name (optional)</label>
      <input type="text" id="f-name" value="${escapeHtml(state.form.name)}" placeholder="e.g. Alex Turner" />
      <label class="sr-label">Your background</label>
      <select id="f-role"></select>
      <label class="sr-label">Which region(s) did you test?</label>
      <div class="sr-checks" id="f-regions"></div>
      <label class="sr-label">Flight-school / training history</label>
      <textarea id="f-training" placeholder="e.g. school name, hours flown, stage of training, licences held">${escapeHtml(state.form.trainingHistory)}</textarea>
      <label class="sr-label">When did you start using SafeRoute Academy?</label>
      <input type="text" id="f-startdate" value="${escapeHtml(state.form.startDate)}" placeholder="e.g. mid-August 2026, or '3 weeks ago'" />
      <label class="sr-label">Overall rating</label>
      <div class="sr-stars" id="f-overall"></div>
    `;
    container.appendChild(card);

    const roleSelect = card.querySelector('#f-role');
    ROLES.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r; opt.textContent = r;
      if (r === state.form.role) opt.selected = true;
      roleSelect.appendChild(opt);
    });
    roleSelect.onchange = e => state.form.role = e.target.value;

    const regionsEl = card.querySelector('#f-regions');
    REGIONS.forEach(r => {
      const id = 'region-' + r.replace(/[^a-z0-9]/gi, '');
      const wrapDiv = document.createElement('label');
      wrapDiv.className = 'sr-check-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = id;
      cb.checked = state.form.regionsTested.includes(r);
      cb.onchange = () => {
        if (cb.checked) {
          if (!state.form.regionsTested.includes(r)) state.form.regionsTested.push(r);
        } else {
          state.form.regionsTested = state.form.regionsTested.filter(x => x !== r);
        }
      };
      wrapDiv.appendChild(cb);
      wrapDiv.appendChild(document.createTextNode(' ' + r));
      regionsEl.appendChild(wrapDiv);
    });

    card.querySelector('#f-name').oninput = e => state.form.name = e.target.value;
    card.querySelector('#f-training').oninput = e => state.form.trainingHistory = e.target.value;
    card.querySelector('#f-startdate').oninput = e => state.form.startDate = e.target.value;
    buildStars(card.querySelector('#f-overall'), 'overall');

    const card2 = document.createElement('div');
    card2.className = 'sr-card';
    card2.innerHTML = `
      <div class="sr-section-title">Appearance &amp; colour scheme</div>
      <div class="sr-section-sub">Layout, readability, the navy/cyan look</div>
      <div class="sr-stars" id="f-appearance"></div>
      <label class="sr-label">Anything you'd change?</label>
      <textarea id="f-appearance-notes" placeholder="e.g. hard to read text on dark backgrounds, icons too small...">${escapeHtml(state.form.appearanceNotes)}</textarea>
    `;
    container.appendChild(card2);
    buildStars(card2.querySelector('#f-appearance'), 'appearance');
    card2.querySelector('#f-appearance-notes').oninput = e => state.form.appearanceNotes = e.target.value;

    const card3 = document.createElement('div');
    card3.className = 'sr-card';
    card3.innerHTML = `
      <div class="sr-section-title">Missing airfields</div>
      <div class="sr-section-sub">Any airports or airfields you looked for but couldn't find</div>
      <textarea id="f-airfields" placeholder="e.g. EGFF, KVRB, or a whole region you'd expect covered"></textarea>
    `;
    container.appendChild(card3);
    card3.querySelector('#f-airfields').value = state.form.missingAirfields;
    card3.querySelector('#f-airfields').oninput = e => state.form.missingAirfields = e.target.value;

    const card4 = document.createElement('div');
    card4.className = 'sr-card';
    card4.innerHTML = `
      <div class="sr-section-title">How you used it</div>
      <div class="sr-section-sub">Which parts of the app you actually used</div>
      <textarea id="f-parts" placeholder="e.g. weather briefing, airfield notes, route planning..."></textarea>
      <label class="sr-label">What did you find (or would you have found) useful?</label>
      <textarea id="f-useful" placeholder="What worked well, or what's missing that would help"></textarea>
      <label class="sr-label">What did you find confusing?</label>
      <textarea id="f-confusing" placeholder="Anything unclear, hard to find, or that didn't behave as expected"></textarea>
      <label class="sr-label">Did it change how you prepared for a flight?</label>
      <textarea id="f-changed" placeholder="e.g. checked something you wouldn't normally have, changed a go/no-go decision..."></textarea>
    `;
    container.appendChild(card4);
    card4.querySelector('#f-parts').value = state.form.partsUsed;
    card4.querySelector('#f-parts').oninput = e => state.form.partsUsed = e.target.value;
    card4.querySelector('#f-useful').value = state.form.foundUseful;
    card4.querySelector('#f-useful').oninput = e => state.form.foundUseful = e.target.value;
    card4.querySelector('#f-confusing').value = state.form.confusing;
    card4.querySelector('#f-confusing').oninput = e => state.form.confusing = e.target.value;
    card4.querySelector('#f-changed').value = state.form.changedPrep;
    card4.querySelector('#f-changed').oninput = e => state.form.changedPrep = e.target.value;

    const card5 = document.createElement('div');
    card5.className = 'sr-card';
    card5.innerHTML = `
      <div class="sr-section-title">Looking ahead</div>
      <div class="sr-section-sub">What's next for you and the app</div>
      <label class="sr-label">What additional functionality would you want?</label>
      <textarea id="f-additional" placeholder="Features, data, or tools you'd like to see added"></textarea>
      <label class="sr-label">Would you continue using it?</label>
      <select id="f-continue"></select>
      <label class="sr-label">Would you recommend it to other student pilots?</label>
      <select id="f-recommend"></select>
    `;
    container.appendChild(card5);
    card5.querySelector('#f-additional').value = state.form.additionalFunctionality;
    card5.querySelector('#f-additional').oninput = e => state.form.additionalFunctionality = e.target.value;

    const continueSelect = card5.querySelector('#f-continue');
    const contPlaceholder = document.createElement('option');
    contPlaceholder.value = ''; contPlaceholder.textContent = 'Select...'; contPlaceholder.disabled = true;
    if (!state.form.continueUsing) contPlaceholder.selected = true;
    continueSelect.appendChild(contPlaceholder);
    YES_NO_MAYBE.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      if (v === state.form.continueUsing) opt.selected = true;
      continueSelect.appendChild(opt);
    });
    continueSelect.onchange = e => state.form.continueUsing = e.target.value;

    const recommendSelect = card5.querySelector('#f-recommend');
    const recPlaceholder = document.createElement('option');
    recPlaceholder.value = ''; recPlaceholder.textContent = 'Select...'; recPlaceholder.disabled = true;
    if (!state.form.recommend) recPlaceholder.selected = true;
    recommendSelect.appendChild(recPlaceholder);
    YES_NO_MAYBE.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      if (v === state.form.recommend) opt.selected = true;
      recommendSelect.appendChild(opt);
    });
    recommendSelect.onchange = e => state.form.recommend = e.target.value;

    const card5b = document.createElement('div');
    card5b.className = 'sr-card';
    card5b.innerHTML = `
      <div class="sr-section-title">→ PROFESSIONAL OPINION</div>
      <label class="sr-label">Would you recommend SafeRoute Academy to other student pilots or flight schools?</label>
      <div class="sr-radio-group" id="f-prof-recommend"></div>
      <label class="sr-label">In your professional opinion, does SafeRoute Academy add genuine educational or safety value for student pilots?</label>
      <div class="sr-radio-group" id="f-prof-value"></div>
      <label class="sr-label">If yes — would you be willing to say so in writing? A short note on how you've used it and what value it's added would be genuinely useful for ongoing development.</label>
      <div class="sr-radio-group" id="f-prof-writeup"></div>
    `;
    container.appendChild(card5b);
    buildRadioGroup(card5b.querySelector('#f-prof-recommend'), 'wouldRecommendProfessionally', 'prof-recommend');
    buildRadioGroup(card5b.querySelector('#f-prof-value'), 'addsGenuineValue', 'prof-value');
    buildRadioGroup(card5b.querySelector('#f-prof-writeup'), 'willingToWriteUp', 'prof-writeup');

    const card6 = document.createElement('div');
    card6.className = 'sr-card';
    card6.innerHTML = `
      <div class="sr-section-title">Bugs or issues</div>
      <div class="sr-section-sub">Anything that crashed, looked wrong, or didn't work</div>
      <textarea id="f-bugs" placeholder="Optional — describe what happened and what you expected"></textarea>
      <label class="sr-label">Anything else?</label>
      <textarea id="f-general" placeholder="Open floor — any other thoughts"></textarea>
    `;
    container.appendChild(card6);
    card6.querySelector('#f-bugs').value = state.form.bugs;
    card6.querySelector('#f-bugs').oninput = e => state.form.bugs = e.target.value;
    card6.querySelector('#f-general').value = state.form.general;
    card6.querySelector('#f-general').oninput = e => state.form.general = e.target.value;

    const submitCard = document.createElement('div');
    submitCard.innerHTML = `
      <button class="sr-submit" id="f-submit">Send feedback</button>
      <div class="sr-status" id="f-status"></div>
    `;
    container.appendChild(submitCard);
    submitCard.querySelector('#f-submit').onclick = submit;
    if (state.saving) {
      submitCard.querySelector('#f-submit').disabled = true;
      submitCard.querySelector('#f-submit').textContent = 'Sending...';
    }
    if (state.error) submitCard.querySelector('#f-status').textContent = state.error;

    renderAdminToggle(container);
  }

  function buildStars(el, field) {
    el.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const s = document.createElement('span');
      s.className = 'sr-star' + (state.form[field] >= i ? ' active' : '');
      s.textContent = '★';
      s.onclick = () => { state.form[field] = i; render(); };
      el.appendChild(s);
    }
  }

  function buildRadioGroup(el, field, namePrefix) {
    el.innerHTML = '';
    YES_NO_MAYBE.forEach((v, i) => {
      const id = namePrefix + '-' + i;
      const item = document.createElement('label');
      item.className = 'sr-radio-item' + (state.form[field] === v ? ' selected' : '');
      item.setAttribute('for', id);
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = namePrefix;
      input.id = id;
      input.value = v;
      input.checked = state.form[field] === v;
      input.onchange = () => { state.form[field] = v; render(); };
      item.appendChild(input);
      item.appendChild(document.createTextNode(v === 'Maybe' ? 'Maybe / depends' : v));
      el.appendChild(item);
    });
  }

  function renderAdminToggle(container) {
    const toggle = document.createElement('div');
    toggle.className = 'sr-toggle-admin';
    const btn = document.createElement('button');
    btn.textContent = state.showAdmin ? 'Hide all responses' : 'View all responses';
    btn.onclick = async () => {
      state.showAdmin = !state.showAdmin;
      if (state.showAdmin) await loadEntries();
      render();
    };
    toggle.appendChild(btn);
    container.appendChild(toggle);

    if (state.showAdmin) {
      const list = document.createElement('div');
      list.className = 'sr-card';
      if (state.loadingEntries) {
        list.innerHTML = '<div class="sr-empty">Loading responses…</div>';
      } else if (state.entries.length === 0) {
        list.innerHTML = '<div class="sr-empty">No responses yet.</div>';
      } else {
        list.innerHTML = '<div class="sr-section-title">All responses (' + state.entries.length + ')</div>';
        state.entries.slice().reverse().forEach(e => {
          const div = document.createElement('div');
          div.className = 'sr-entry';
          const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
          div.innerHTML = `
            <div class="sr-entry-meta"><span>${escapeHtml(e.name || 'Anonymous')} · ${escapeHtml(e.role || '')}</span><span>${e.date ? new Date(e.date).toLocaleDateString() : ''}</span></div>
            ${e.regionsTested && e.regionsTested.length ? `<div class="sr-entry-field"><b>Region(s) tested:</b> ${escapeHtml(e.regionsTested.join(', '))}</div>` : ''}
            ${e.startDate ? `<div class="sr-entry-field"><b>Started using:</b> ${escapeHtml(e.startDate)}</div>` : ''}
            ${e.trainingHistory ? `<div class="sr-entry-field"><b>Training history:</b> ${escapeHtml(e.trainingHistory)}</div>` : ''}
            ${e.overall ? `<div class="sr-entry-field"><b>Overall:</b> ${stars(e.overall)}</div>` : ''}
            ${e.appearance ? `<div class="sr-entry-field"><b>Appearance:</b> ${stars(e.appearance)}</div>` : ''}
            ${e.appearanceNotes ? `<div class="sr-entry-field"><b>Appearance notes:</b> ${escapeHtml(e.appearanceNotes)}</div>` : ''}
            ${e.missingAirfields ? `<div class="sr-entry-field"><b>Missing airfields:</b> ${escapeHtml(e.missingAirfields)}</div>` : ''}
            ${e.partsUsed ? `<div class="sr-entry-field"><b>Parts used:</b> ${escapeHtml(e.partsUsed)}</div>` : ''}
            ${e.foundUseful ? `<div class="sr-entry-field"><b>Found useful:</b> ${escapeHtml(e.foundUseful)}</div>` : ''}
            ${e.confusing ? `<div class="sr-entry-field"><b>Confusing:</b> ${escapeHtml(e.confusing)}</div>` : ''}
            ${e.changedPrep ? `<div class="sr-entry-field"><b>Changed preparation:</b> ${escapeHtml(e.changedPrep)}</div>` : ''}
            ${e.additionalFunctionality ? `<div class="sr-entry-field"><b>Wants added:</b> ${escapeHtml(e.additionalFunctionality)}</div>` : ''}
            ${e.continueUsing ? `<div class="sr-entry-field"><b>Would continue using:</b> ${escapeHtml(e.continueUsing)}</div>` : ''}
            ${e.recommend ? `<div class="sr-entry-field"><b>Would recommend:</b> ${escapeHtml(e.recommend)}</div>` : ''}
            ${e.wouldRecommendProfessionally ? `<div class="sr-entry-field"><b>Would recommend (professional):</b> ${escapeHtml(e.wouldRecommendProfessionally)}</div>` : ''}
            ${e.addsGenuineValue ? `<div class="sr-entry-field"><b>Adds genuine value:</b> ${escapeHtml(e.addsGenuineValue)}</div>` : ''}
            ${e.willingToWriteUp ? `<div class="sr-entry-field"><b>Willing to write up:</b> ${escapeHtml(e.willingToWriteUp)}</div>` : ''}
            ${e.bugs ? `<div class="sr-entry-field"><b>Bugs:</b> ${escapeHtml(e.bugs)}</div>` : ''}
            ${e.general ? `<div class="sr-entry-field"><b>Other:</b> ${escapeHtml(e.general)}</div>` : ''}
          `;
          list.appendChild(div);
        });
      }
      container.appendChild(list);
    }
  }

  async function loadEntries() {
    state.loadingEntries = true;
    render();
    try {
      const keysRes = await window.storage.list('feedback:', true);
      const keys = keysRes && keysRes.keys ? keysRes.keys : [];
      const entries = [];
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r && r.value) entries.push(JSON.parse(r.value));
        } catch (e) {}
      }
      entries.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      state.entries = entries;
    } catch (e) {
      state.entries = [];
    }
    state.loadingEntries = false;
  }

  const FEEDBACK_EMAIL = 'marchantlaurie@icloud.com';

  function stars(n) { return n ? '*'.repeat(n) + ' (' + n + '/5)' : 'Not rated'; }

  function openMail(entry) {
    const subject = 'SafeRoute Academy feedback — ' + (entry.name || 'Anonymous');
    const lines = [
      'Name: ' + (entry.name || 'Anonymous'),
      'Background: ' + (entry.role || ''),
      'Region(s) tested: ' + ((entry.regionsTested && entry.regionsTested.length) ? entry.regionsTested.join(', ') : '-'),
      'Training history: ' + (entry.trainingHistory || '-'),
      'Started using SafeRoute Academy: ' + (entry.startDate || '-'),
      '',
      'Overall rating: ' + stars(entry.overall),
      '',
      'Appearance & colour scheme rating: ' + stars(entry.appearance),
      'Appearance notes: ' + (entry.appearanceNotes || '-'),
      '',
      'Missing airfields: ' + (entry.missingAirfields || '-'),
      '',
      'Parts of the app used: ' + (entry.partsUsed || '-'),
      'Found (or would find) useful: ' + (entry.foundUseful || '-'),
      'Found confusing: ' + (entry.confusing || '-'),
      'Changed preparation as a result: ' + (entry.changedPrep || '-'),
      '',
      'Additional functionality wanted: ' + (entry.additionalFunctionality || '-'),
      'Would continue using: ' + (entry.continueUsing || '-'),
      'Would recommend to other student pilots: ' + (entry.recommend || '-'),
      '',
      'PROFESSIONAL OPINION',
      'Would recommend to other student pilots/flight schools: ' + (entry.wouldRecommendProfessionally || '-'),
      'Adds genuine educational/safety value: ' + (entry.addsGenuineValue || '-'),
      'Willing to write up for development: ' + (entry.willingToWriteUp || '-'),
      '',
      'Bugs / issues: ' + (entry.bugs || '-'),
      '',
      'Other comments: ' + (entry.general || '-'),
      '',
      'Submitted: ' + entry.date
    ];
    const body = lines.join('\n');
    const mailtoUrl = 'mailto:' + encodeURIComponent(FEEDBACK_EMAIL) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);
    window.location.href = mailtoUrl;
  }

  async function submit() {
    state.saving = true;
    state.error = "";
    render();
    const entry = Object.assign({}, state.form, { date: new Date().toISOString() });
    const key = 'feedback:' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    try {
      await window.storage.set(key, JSON.stringify(entry), true);
    } catch (e) {
      // Backup save failed silently — email is the primary delivery path
    }
    state.lastEntry = entry;
    state.saving = false;
    state.submitted = true;
    render();
    openMail(entry);
  }

  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  render();
})();
</script>
</body>
</html>
